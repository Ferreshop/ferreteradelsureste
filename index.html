<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería del Sureste</title>
    <style>
        /* ================= DISEÑO INDUSTRIAL (FERRETERÍA) ================= */
        :root {
            --color-principal: #1a1a1a; /* Negro industrial */
            --color-secundario: #e67e22; /* Naranja herramienta */
            --color-acento: #d35400; /* Naranja oscuro */
            --color-fondo: #f4f4f4;
            --color-texto: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--color-fondo);
            color: var(--color-texto);
        }

        /* Encabezado */
        header {
            background-color: var(--color-principal);
            color: white;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 4px solid var(--color-secundario);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: white;
        }

        .logo-container h1 { 
            margin: 0; 
            font-size: 2rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav ul { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        nav a { color: white; text-decoration: none; font-weight: bold; text-transform: uppercase;}
        nav a:hover { color: var(--color-secundario); }

        /* Banner Hero */
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(rgba(26, 26, 26, 0.8), rgba(26, 26, 26, 0.8)), url('https://images.unsplash.com/photo-1504148455328-c376907d081c?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80') center/cover;
            color: white;
        }

        .hero h2 { font-size: 2.5rem; margin-bottom: 10px; color: var(--color-secundario); }
        .hero p { font-size: 1.2rem; }

        /* Tienda */
        .seccion { padding: 3rem 5%; text-align: center; }
        .seccion h2 { color: var(--color-principal); margin-bottom: 2rem; font-size: 2rem; text-transform: uppercase; }

        .buscador-container { max-width: 600px; margin: 0 auto 30px auto; }
        #inputBuscador {
            width: 100%; padding: 15px; font-size: 16px; 
            border: 2px solid var(--color-principal); 
            border-radius: 5px; box-sizing: border-box;
        }

        .grid-productos { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; }

        .producto-card {
            background: white; border-radius: 8px; padding: 15px; width: 250px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s; display: flex; flex-direction: column;
            border-top: 4px solid var(--color-secundario);
        }

        .producto-card:hover { transform: translateY(-5px); }
        .producto-img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; margin-bottom: 15px; }
        .producto-dept { font-size: 0.8rem; color: #7f8c8d; font-weight: bold; }
        .producto-titulo { font-size: 1.1rem; margin: 10px 0; color: var(--color-principal); flex-grow: 1; }
        .producto-precio { font-size: 1.4rem; color: var(--color-principal); font-weight: 900; margin-bottom: 10px; }
        
        .btn-agregar {
            background-color: var(--color-secundario); color: white; border: none;
            padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        .btn-agregar:hover { background-color: var(--color-acento); }

        /* Carrito (Igual que el anterior pero con colores adaptados) */
        #btn-carrito-flotante {
            position: fixed; bottom: 30px; right: 30px;
            background-color: var(--color-principal); color: white; border: 2px solid var(--color-secundario);
            border-radius: 50%; width: 70px; height: 70px; font-size: 24px; cursor: pointer; 
            z-index: 1000; display: flex; justify-content: center; align-items: center;
        }
        .contador-carrito {
            position: absolute; top: 0; right: 0; background-color: var(--color-secundario);
            color: white; border-radius: 50%; width: 25px; height: 25px; font-size: 14px; font-weight: bold; 
            display: flex; justify-content: center; align-items: center;
        }
        #modal-carrito {
            position: fixed; top: 0; right: -400px; width: 350px; height: 100vh;
            background-color: white; box-shadow: -5px 0 15px rgba(0,0,0,0.2);
            z-index: 2000; transition: right 0.3s ease; display: flex; flex-direction: column;
        }
        #modal-carrito.abierto { right: 0; }
        .carrito-header { background-color: var(--color-principal); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--color-secundario); }
        .btn-cerrar { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .carrito-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .item-carrito { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .carrito-footer { padding: 20px; border-top: 2px solid #eee; background-color: #f8f9fa; }
        .total-container { display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; }
        .btn-whatsapp { width: 100%; padding: 15px; background-color: #25D366; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; }
        #overlay.activo { display: block; }
        footer { background-color: var(--color-principal); color: white; text-align: center; padding: 2rem; margin-top: 2rem; border-top: 4px solid var(--color-secundario); }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-container">
            <!-- Si tienes un logo, súbelo como logo-ferre.png -->
            <!-- <img src="logo-ferre.png" alt="Logo Ferretería" style="height: 60px;"> -->
            <h1>Ferretería del Sureste</h1>
        </a>
        <nav>
            <ul>
                <li><a href="#tienda">Catálogo</a></li>
                <li><a href="#" onclick="abrirCarrito()">🛒 Pedidos</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h2>Construcción y Herramientas</h2>
        <p>El mejor surtido en material eléctrico, plomería y ferretería en general.</p>
    </section>

    <section id="tienda" class="seccion">
        <h2>Nuestro Catálogo</h2>
        <div class="buscador-container">
            <input type="text" id="inputBuscador" placeholder="🔍 Busca pinzas, cables, focos..." onkeyup="filtrarProductos()">
        </div>
        <div class="grid-productos" id="contenedorProductos"></div>
    </section>

    <footer>
        <h3>📍 Ferretería del Sureste</h3>
        <p>Expertos en Herramientas y Construcción</p>
    </footer>

    <button id="btn-carrito-flotante" onclick="abrirCarrito()">🛒<span class="contador-carrito" id="contador-flotante">0</span></button>
    <div id="overlay" onclick="cerrarCarrito()"></div>

    <div id="modal-carrito">
        <div class="carrito-header">
            <h3>Tu Pedido</h3>
            <button class="btn-cerrar" onclick="cerrarCarrito()">✖</button>
        </div>
        <div class="carrito-body" id="lista-carrito"></div>
        <div class="carrito-footer">
            <div class="total-container">
                <span>Total:</span>
                <span id="total-carrito">$0.00</span>
            </div>
            
            <div style="margin-bottom: 15px; text-align: left;">
                <label for="metodoPago" style="font-weight: bold; color: var(--color-principal);">Forma de pago:</label>
                <select id="metodoPago" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px;">
                    <option value="Efectivo (En mostrador)">💵 Efectivo (En mostrador)</option>
                    <option value="Transferencia">📱 Transferencia / SPEI</option>
                </select>
            </div>

            <button class="btn-whatsapp" onclick="enviarPedidoWhatsApp()">Enviar Cotización / Pedido</button>
        </div>
    </div>

    <script>
        // Catálogo Base (Aquí subiremos tus datos de Sicar X después)
        const inventario = [
            { id: 'F001', nombre: 'Pinzas de Electricista Truper 8"', departamento: 'HERRAMIENTAS', precio: 145.0, existencia: 12, imagen: 'https://placehold.co/400x300/e67e22/white?text=Pinzas' },
            { id: 'F002', nombre: 'Cámara Wifi Robotizada Tipo Domo 3mp, VOLTECK', departamento: 'ELÉCTRICO', precio: 845.0, existencia: 2, imagen: 'https://placehold.co/400x300/e67e22/white?text=Camara' },
            { id: 'F003', nombre: 'SENSOR DE MOVIMIENTO CON ALARMA VOLTECK', departamento: 'ELÉCTRICO', precio: 219.0, existencia: 5, imagen: 'https://placehold.co/400x300/e67e22/white?text=Sensor' },
            { id: 'F004', nombre: 'Cinta de Aislar 33+ Negra', departamento: 'ELÉCTRICO', precio: 15.0, existencia: 50, imagen: 'https://placehold.co/400x300/e67e22/white?text=Cinta' },
            { id: 'F005', nombre: 'Regulador de Voltaje Qian 1000VA Automático', departamento: 'ELÉCTRICO', precio: 430.0, existencia: 3, imagen: 'https://placehold.co/400x300/e67e22/white?text=Regulador' }
        ];

        let carrito = [];

        function mostrarProductos(lista) {
            const contenedor = document.getElementById("contenedorProductos");
            contenedor.innerHTML = ""; 
            
            lista.forEach(producto => {
                let textoExistencia = producto.existencia > 0 
                    ? `<div style="font-size: 0.9rem; color: #27ae60; margin-bottom: 10px; font-weight: bold;">✅ ${producto.existencia} en stock</div>` 
                    : `<div style="font-size: 0.9rem; color: #c0392b; margin-bottom: 10px; font-weight: bold;">❌ Agotado</div>`;

                const tarjeta = `
                <div class="producto-card">
                    <img src="${producto.imagen}" alt="${producto.nombre}" class="producto-img">
                    <span class="producto-dept">${producto.departamento}</span>
                    <h3 class="producto-titulo">${producto.nombre}</h3>
                    <div class="producto-precio">$${producto.precio.toFixed(2)} MXN</div>
                    ${textoExistencia}
                    <button class="btn-agregar" onclick="agregarAlCarrito('${producto.id}')" ${producto.existencia <= 0 ? 'disabled style="background-color:#95a5a6; cursor:not-allowed;"' : ''}>
                        ${producto.existencia <= 0 ? 'Sin stock' : 'Agregar'}
                    </button>
                </div>`;
                contenedor.innerHTML += tarjeta;
            });
        }

        function filtrarProductos() {
            const textoBusqueda = document.getElementById("inputBuscador").value.toLowerCase();
            const filtrados = inventario.filter(prod => 
                prod.nombre.toLowerCase().includes(textoBusqueda) || 
                prod.departamento.toLowerCase().includes(textoBusqueda)
            );
            mostrarProductos(filtrados);
        }

        function agregarAlCarrito(idProducto) {
            const producto = inventario.find(p => p.id === idProducto);
            const existe = carrito.find(p => p.id === idProducto);
            
            if (existe) {
                if (existe.cantidad >= producto.existencia) {
                    alert(`Solo contamos con ${producto.existencia} piezas.`);
                    return;
                }
                existe.cantidad++;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            actualizarCarritoUI();
        }

        function eliminarDelCarrito(idProducto) {
            carrito = carrito.filter(p => p.id !== idProducto);
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const listaCarrito = document.getElementById("lista-carrito");
            const contadorFlotante = document.getElementById("contador-flotante");
            const totalCarrito = document.getElementById("total-carrito");
            
            listaCarrito.innerHTML = "";
            let total = 0;
            let cantidadTotal = 0;

            if (carrito.length === 0) {
                listaCarrito.innerHTML = '<p style="text-align:center; color:#7f8c8d;">Tu carrito está vacío.</p>';
            } else {
                carrito.forEach(item => {
                    const subtotal = item.precio * item.cantidad;
                    total += subtotal;
                    cantidadTotal += item.cantidad;

                    listaCarrito.innerHTML += `
                    <div class="item-carrito">
                        <div class="item-info">
                            <h4>${item.nombre}</h4>
                            <small>$${item.precio.toFixed(2)} x ${item.cantidad}</small>
                        </div>
                        <div style="text-align:right;">
                            <strong>$${subtotal.toFixed(2)}</strong><br>
                            <button style="background:none; border:none; color:red; cursor:pointer;" onclick="eliminarDelCarrito('${item.id}')">Quitar</button>
                        </div>
                    </div>`;
                });
            }
            contadorFlotante.innerText = cantidadTotal;
            totalCarrito.innerText = `$${total.toFixed(2)} MXN`;
        }

        function abrirCarrito() { document.getElementById("modal-carrito").classList.add("abierto"); document.getElementById("overlay").classList.add("activo"); }
        function cerrarCarrito() { document.getElementById("modal-carrito").classList.remove("abierto"); document.getElementById("overlay").classList.remove("activo"); }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) return alert("Agrega al menos un producto.");
            const telefono = "529620000000"; // REEMPLAZAR POR TU NÚMERO
            const metodoPago = document.getElementById("metodoPago").value;
            
            let mensaje = "¡Hola Ferretería del Sureste! Solicito el siguiente pedido/cotización:\n\n";
            let total = 0;
            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                mensaje += `▪ ${item.cantidad}x ${item.nombre} ($${subtotal.toFixed(2)})\n`;
            });
            mensaje += `\n*Total estimado: $${total.toFixed(2)} MXN*`;
            mensaje += `\n*Forma de pago:* ${metodoPago}`;

            window.open(`https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`, "_blank");
        }

        mostrarProductos(inventario);
    </script>
</body>
</html>
